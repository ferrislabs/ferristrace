name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # Decides which of the jobs below have anything to check. A pull request
  # that only touches the web app never compiles Rust, and one that only
  # touches Rust never installs the web app. A manual run checks everything.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.rust == 'true' }}
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - "crates/**"
              - "apps/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - ".github/workflows/ci.yaml"
            web:
              - "web/**"
              - ".github/workflows/ci.yaml"

  fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          components: rustfmt
          cache: false
      - run: cargo fmt --all -- --check

  # Pull requests restore the caches main saved and never write their own:
  # one multi-GB entry per pull request would evict main's under the 10 GB
  # repository quota.
  clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          components: clippy
          cache: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-clippy
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
      - name: the workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: the server with the ee crate
        run: cargo clippy -p ferristrace-server --all-targets --features ee --locked -- -D warnings

  # Reads the dependency graph only, so it compiles nothing.
  layers:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          cache: false
      - name: the domain and the application depend on nothing that does I/O
        run: |
          set -eu
          for crate in ferristrace-domain ferristrace-application; do
            found=$(cargo tree -p "$crate" -e normal --prefix none --locked \
              | awk '{print $1}' \
              | grep -xE 'sqlx|axum|tonic|tokio|clickhouse|redis|reqwest|lettre' \
              | sort -u || true)
            if [ -n "$found" ]; then
              echo "::error::$crate depends on $(echo "$found" | tr '\n' ' ')"
              exit 1
            fi
          done
      - name: the api names no adapter crate
        run: |
          set -eu
          found=$(cargo tree -p ferristrace-api -e normal --prefix none --locked \
            | awk '{print $1}' \
            | grep -xE 'ferristrace-(postgres|clickhouse|redis|infra)' \
            | sort -u || true)
          if [ -n "$found" ]; then
            echo "::error::ferristrace-api depends on $(echo "$found" | tr '\n' ' ')"
            exit 1
          fi
      - name: the default build excludes the ee crate
        run: |
          if cargo tree -p ferristrace-server -e normal --locked | grep -q ferristrace-ee; then
            echo "::error::ferristrace-ee is in the default dependency graph"
            exit 1
          fi
      - name: the ee feature pulls the ee crate in
        run: |
          if ! cargo tree -p ferristrace-server -e normal --features ee --locked | grep -q ferristrace-ee; then
            echo "::error::the ee feature does not pull ferristrace-ee in"
            exit 1
          fi

  # One build of the workspace runs every test, the adapters' included: the
  # REQUIRE_* variables turn a store that is not there into a failure rather
  # than a skipped suite.
  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ferristrace
          POSTGRES_PASSWORD: ferristrace
          POSTGRES_DB: ferristrace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ferristrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:24.8-alpine
        env:
          CLICKHOUSE_PASSWORD: ferristrace
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://ferristrace:ferristrace@localhost:5432/ferristrace
      REQUIRE_DATABASE_URL: "1"
      REDIS_URL: redis://localhost:6379
      REQUIRE_REDIS_URL: "1"
      CLICKHOUSE_URL: http://localhost:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ferristrace
      REQUIRE_CLICKHOUSE_URL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          cache: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-test
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
      - name: unit, integration and adapter tests
        run: cargo test --workspace --locked
      - name: doc tests
        run: cargo test --doc --workspace --locked
      - name: small versus large batches
        if: github.event_name == 'push'
        run: cargo run -p ferristrace-clickhouse --example batching_benchmark --release --locked

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: the front end type checks
        run: pnpm typecheck
      - name: the front end builds
        run: pnpm build

  # The one check to require: green when every job that had something to
  # check passed, whichever of them the changes above skipped.
  ci:
    if: always()
    needs: [changes, fmt, clippy, layers, test, web]
    runs-on: ubuntu-latest
    steps:
      - name: every job that ran passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            echo "::error::a check failed or was cancelled"
            exit 1
          fi
