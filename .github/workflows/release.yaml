name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: read

env:
  IMAGE: ghcr.io/ferrislabs/ferristrace

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the tag matches the version the workspace declares
        id: version
        run: |
          set -eu
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "//; s/"$//')
          test "${tagged%-rc.*}" = "$declared" || {
            echo "::error::the tag says ${tagged%-rc.*} and Cargo.toml says $declared"
            echo "Bump the workspace version in its own commit before tagging."
            exit 1
          }
          for field in version appVersion; do
            charted=$(awk -v f="$field:" '$1 == f {gsub(/"/, "", $2); print $2}' charts/ferristrace/Chart.yaml)
            test "$charted" = "$declared" || {
              echo "::error::Cargo.toml says $declared and the chart's $field says $charted"
              echo "Bump charts/ferristrace/Chart.yaml with the workspace."
              exit 1
            }
          done
          echo "version=${tagged}" >> "$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          cache: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-release
          save-if: false
      - name: the tag is formatted, lint-clean and green
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo test --doc --workspace --locked

  images:
    needs: check
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker.yaml
    with:
      push: true

  chart:
    needs: [check, images]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/helm.yaml
    with:
      version: ${{ needs.check.outputs.version }}

  release:
    needs: [images, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the changelog of this tag, from its commits
        id: cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          config: cliff.toml
          args: --latest --strip header
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: measure what was published
        id: sizes
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          {
            echo "| Image | Platform | Compressed |"
            echo "| --- | --- | --- |"
          } > sizes.md
          for suffix in "" "-ee"; do
            tag="${version}${suffix}"
            docker buildx imagetools inspect "${IMAGE}:${tag}" --raw \
              | jq -r '.manifests[]? | select(.platform.os == "linux")
                       | select(.platform.architecture != "unknown")
                       | "\(.platform.architecture) \(.digest)"' \
              | while read -r arch digest; do
                  bytes=$(docker buildx imagetools inspect "${IMAGE}@${digest}" --raw \
                    | jq '[.layers[].size] | add')
                  mib=$(awk -v b="$bytes" 'BEGIN { printf "%.1f", b / 1048576 }')
                  echo "| \`${IMAGE}:${tag}\` | linux/${arch} | ${mib} MiB |" >> sizes.md
                done
          done
          cat sizes.md >> "$GITHUB_STEP_SUMMARY"
      - name: cut the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.cliff.outputs.content }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          {
            echo "## Images"
            echo
            echo '```sh'
            echo "docker pull ${IMAGE}:${version}"
            echo '```'
            echo
            echo "The \`-ee\` tag carries the cloud build. Both are"
            echo "linux/amd64 and linux/arm64 with provenance attached."
            echo
            cat sizes.md
            echo
            echo "## Helm chart"
            echo
            echo '```sh'
            echo "helm install ferristrace oci://ghcr.io/ferrislabs/charts/ferristrace --version ${version}"
            echo '```'
          } > body.md
          echo >> body.md
          printf '%s\n' "$NOTES" >> body.md
          prerelease=""
          case "$version" in *-rc.*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file body.md \
            $prerelease
