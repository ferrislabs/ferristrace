[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/application",
    "crates/macros",
    "crates/postgres",
    "crates/otlp",
    "crates/clickhouse",
    "crates/redis",
    "crates/infra",
    "crates/api",
    "crates/mcp-args",
    "crates/env-file",
    "apps/server",
    "apps/mcp",
    "apps/mcp-gateway",
]
default-members = [
    "crates/domain",
    "crates/application",
    "crates/macros",
    "crates/postgres",
    "crates/otlp",
    "crates/clickhouse",
    "crates/redis",
    "crates/infra",
    "crates/api",
    "crates/mcp-args",
    "crates/env-file",
    "apps/server",
    "apps/mcp",
    "apps/mcp-gateway",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
ferristrace-domain = { path = "crates/domain" }
ferristrace-application = { path = "crates/application" }
ferristrace-macros = { path = "crates/macros" }
ferristrace-postgres = { path = "crates/postgres" }
ferristrace-otlp = { path = "crates/otlp" }
ferristrace-clickhouse = { path = "crates/clickhouse" }
ferristrace-redis = { path = "crates/redis" }
ferristrace-infra = { path = "crates/infra" }
ferristrace-api = { path = "crates/api" }
ferristrace-mcp-args = { path = "crates/mcp-args" }
ferristrace-env-file = { path = "crates/env-file" }

anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
base64 = "0.23.1"
bytes = "1.12.1"
chacha20poly1305 = "0.11.0"
clickhouse = { version = "0.15.3", features = ["uuid", "inserter"] }
figment = { version = "0.10.19", features = ["env", "toml"] }
flate2 = "1.1.6"
hex = "0.4.3"
hmac = "0.13.0"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-rustls-tls"] }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["use_pem", "rust_crypto"] }
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic", "trace", "logs", "metrics"] }
proc-macro2 = "1.0.107"
prost = "0.14.4"
quote = "1.0.47"
proptest = "1"
rand = "0.10.3"
rmcp = { version = "3.6.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "charset", "json"] }
redis = { version = "1.8.0", default-features = false, features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_repr = "0.1.20"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid"] }
subtle = "2.6.1"
tar = { version = "0.4.45", default-features = false }
syn = { version = "2.0.119", features = ["full"] }
time = { version = "0.3.47", default-features = false, features = ["std"] }
thiserror = "2.0.21"
tokio-stream = "0.1.17"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
tonic = { version = "0.14.3", features = ["gzip"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["decompression-gzip", "fs", "limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
return_self_not_must_use = "allow"
duration_suboptimal_units = "allow"
unused_async_trait_impl = "allow"
assert_is_empty = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
