[package]
name = "ferristrace-mcp-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "ferristrace_mcp_gateway"
path = "src/lib.rs"

[[bin]]
name = "ferristrace-mcp-gateway"
path = "src/main.rs"

[dependencies]
ferristrace-mcp-args.workspace = true
anyhow.workspace = true
axum.workspace = true
bytes.workspace = true
ferristrace-env-file.workspace = true
figment.workspace = true
jiff.workspace = true
jsonwebtoken.workspace = true
opentelemetry-proto.workspace = true
prost.workspace = true
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
base64.workspace = true
cedar-policy = "=4.14.1"
ferristrace-mcp.path = "../mcp"
figment = { workspace = true, features = ["test"] }
p256 = { version = "0.13.2", features = ["pkcs8"] }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
