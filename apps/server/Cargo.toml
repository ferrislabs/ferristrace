[package]
name = "ferristrace-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "ferristrace"
path = "src/main.rs"

[dependencies]
ferristrace-api.workspace = true
ferristrace-application.workspace = true
ferristrace-domain.workspace = true
ferristrace-clickhouse.workspace = true
ferristrace-infra.workspace = true
ferristrace-postgres.workspace = true
ferristrace-redis.workspace = true
ferristrace-ee = { workspace = true, optional = true }
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
figment.workspace = true
reqwest.workspace = true
serde = { workspace = true, features = ["derive"] }
sqlx.workspace = true
tokio.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[features]
ee = ["dep:ferristrace-ee"]

[dev-dependencies]
figment = { workspace = true, features = ["test"] }
tower.workspace = true

[lints]
workspace = true
