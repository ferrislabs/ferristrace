replicaCount: 2
config:
  spans:
    url: http://clickhouse.data.svc:8123
    coldAfterDays: 7
  oidc:
    enabled: true
    issuer: https://id.example.com/realms/ferris
    clientId: ferristrace
  agents:
    issuer: https://id.example.com/realms/ferris
    audience: ferristrace
  mail:
    enabled: true
    relay: mail.example.com
    username: postmaster
    from: FerrisTrace <no-reply@example.com>
    baseUrl: https://ferristrace.example.com
  objects:
    enabled: true
    endpoint: https://account.r2.cloudflarestorage.com
    bucket: ferristrace-avatars
    region: auto
  alerts:
    allowPrivateWebhooks: false
    baseUrl: https://ferristrace.example.com
secrets:
  clickhousePassword:
    name: ferristrace-clickhouse
    key: password
  atRestKey:
    name: ferristrace-at-rest
    key: key
httpRoute:
  enabled: true
  parentRefs:
    - name: shared
      namespace: gateway
  hostnames:
    - ferristrace.example.com
podDisruptionBudget:
  enabled: true
networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gateway
extraEnv:
  - name: EXAMPLE
    value: "1"
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: ferristrace
