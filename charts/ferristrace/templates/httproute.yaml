{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ferristrace.fullname" . }}
  labels:
    {{- include "ferristrace.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- required "httpRoute.parentRefs is required when httpRoute.enabled" .Values.httpRoute.parentRefs | toYaml | nindent 4 }}
  hostnames:
    {{- required "httpRoute.hostnames is required when httpRoute.enabled" .Values.httpRoute.hostnames | toYaml | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.httpRoute.path }}
      backendRefs:
        - name: {{ include "ferristrace.fullname" . }}
          port: {{ .Values.service.httpPort }}
{{- end }}
