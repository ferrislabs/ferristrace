{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ferristrace.fullname" . }}
  labels:
    {{- include "ferristrace.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ferristrace.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 4318
          protocol: TCP
        - port: 4317
          protocol: TCP
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
