# -- Override the chart name.
nameOverride: ""
# -- Override the full resource name.
fullnameOverride: ""

image:
  # -- Image repository.
  repository: ghcr.io/ferrislabs/ferristrace
  # -- Image tag. Empty means the chart appVersion.
  tag: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Edition: `community` runs `X.Y.Z`, `ee` runs `X.Y.Z-ee`.
edition: community

# -- Pull secrets for a private registry.
imagePullSecrets: []

# -- Replicas. The PodDisruptionBudget exists only above 1.
replicaCount: 1
revisionHistoryLimit: 3
# -- Must exceed the time the server needs to flush its span batch on SIGTERM.
terminationGracePeriodSeconds: 60

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# -- Extra container env entries, raw Kubernetes syntax.
extraEnv: []

service:
  type: ClusterIP
  httpPort: 4318
  grpcPort: 4317
  annotations: {}

# Gateway API route to the HTTP port (OTLP/HTTP, API, web app).
httpRoute:
  enabled: false
  annotations: {}
  # -- Gateways to attach to, e.g. [{name: shared, namespace: gateway}].
  parentRefs: []
  # -- Hostnames, e.g. [ferristrace.example.com].
  hostnames: []
  path: /

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: false
  # -- Peers allowed to reach ports 4317 and 4318. Empty means any source.
  ingressFrom: []

# Non-secret settings, handed to the server as FERRISTRACE_* variables.
config:
  logLevel: info
  # -- Keep true behind TLS. Set false only for plain HTTP.
  cookieSecure: true
  afterSignIn: /
  # -- Empty keeps the web root baked into the image.
  webRoot: ""
  spans:
    # -- ClickHouse HTTP url.
    url: http://clickhouse:8123
    database: ferristrace
    user: ferristrace
    retentionDays: 30
  oidc:
    enabled: false
    issuer: ""
    clientId: ""
    redirectUri: ""
  agents:
    # -- Issuer whose access tokens AI agents present. Empty means the OIDC issuer, or no agents when OIDC is off.
    issuer: ""
    # -- Required for agents to be on: an agent token must name this audience. With an issuer but no audience, agents stay off.
    audience: ""
  mail:
    enabled: false
    relay: ""
    username: ""
    from: ""
    baseUrl: ""
  objects:
    enabled: false
    endpoint: ""
    bucket: ""
    region: ""
  alerts:
    # -- Let webhooks reach private, loopback and link-local addresses. Keep false unless every receiver lives inside the cluster.
    allowPrivateWebhooks: false
    # -- Public address of the web app, used for links in alert mail and webhooks. Empty falls back to config.mail.baseUrl.
    baseUrl: ""

# Existing Secrets, by name and key. This chart never creates or holds a value.
# An empty name leaves the optional ones out.
secrets:
  # -- Required. Default matches a CloudNativePG cluster named `ferristrace`.
  databaseUrl:
    name: ferristrace-app
    key: uri
  # -- Required.
  redisUrl:
    name: ferristrace-redis
    key: url
  clickhousePassword:
    name: ""
    key: password
  # -- Needed to keep a webhook channel secret. 64 hex characters.
  atRestKey:
    name: ""
    key: at-rest-key
  # -- Read when config.oidc.enabled.
  oidcClientSecret:
    name: ferristrace-oidc
    key: client-secret
  # -- Read when config.mail.enabled.
  smtpPassword:
    name: ferristrace-smtp
    key: password
  # -- Read when config.objects.enabled.
  objectsAccessKeyId:
    name: ferristrace-objects
    key: access-key-id
  objectsSecretAccessKey:
    name: ferristrace-objects
    key: secret-access-key

# The MCP server and its policy gateway (docs/mcp.md). Off by default.
mcp:
  # -- Deploy `ferristrace-mcp` and `ferristrace-mcp-gateway`. Needs config.oidc or config.agents, an agent audience, and a FerrisKey realm provisioned for it.
  enabled: false
  server:
    image:
      # -- Image repository of the MCP server.
      repository: ghcr.io/ferrislabs/ferristrace-mcp
      # -- Image tag. Empty means the chart appVersion.
      tag: ""
      pullPolicy: IfNotPresent
    replicaCount: 1
    # -- FerrisTrace HTTP API the tools call. Empty means this release's own Service.
    apiUrl: ""
    service:
      port: 8081
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        memory: 128Mi
    extraEnv: []
  gateway:
    image:
      # -- Image repository of the gateway.
      repository: ghcr.io/ferrislabs/ferristrace-mcp-gateway
      # -- Image tag. Empty means the chart appVersion.
      tag: ""
      pullPolicy: IfNotPresent
    replicaCount: 1
    # -- Required. Public base URL of the gateway; the canonical resource of an organisation is `<publicUrl>/orgs/{org}/mcp`.
    publicUrl: ""
    # -- Required. FerrisKey realm issuer, e.g. https://id.example.com/realms/ferristrace.
    issuer: ""
    # -- FerrisTrace's agent audience. Empty means config.agents.audience.
    agentAudience: ""
    # -- FerrisTrace HTTP API read for the PIP lookups. Empty means this release's own Service.
    apiUrl: ""
    # -- Scopes listed in the resource metadata. Empty keeps the four agent scopes.
    scopesSupported: []
    # -- OTLP/HTTP logs url (e.g. http://ferristrace:4318/v1/logs) to also export decisions to FerrisTrace. Needs secrets.ingestKey.
    ingestEndpoint: ""
    pdp:
      # -- Required. FerrisKey base url.
      url: ""
      # -- Required. Realm holding the Cedar policies.
      realm: ""
      # -- Required. The PEP service account (holds evaluate_authorization).
      clientId: ""
      timeoutMs: 1500
    exchange:
      # -- Required. The gateway's own confidential client.
      clientId: ""
    # Existing Secrets, by name and key.
    secrets:
      pdpClientSecret:
        name: ferristrace-mcp-gateway
        key: pdp-client-secret
      exchangeClientSecret:
        name: ferristrace-mcp-gateway
        key: exchange-client-secret
      # -- Read when name is set.
      ingestKey:
        name: ""
        key: ingest-key
    service:
      type: ClusterIP
      port: 8080
      annotations: {}
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        memory: 128Mi
    extraEnv: []
