name: ferristrace

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ferristrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ferristrace}
      POSTGRES_DB: ferristrace
    volumes:
      - postgres:/var/lib/postgresql/data
    # Bound to the loopback so a database whose password defaults to `ferristrace` answers this
    # machine and nothing else. Widening POSTGRES_BIND puts it on the network: set a password first.
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username ferristrace --dbname ferristrace"]
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: ferristrace
      CLICKHOUSE_USER: ferristrace
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-ferristrace}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse:/var/lib/clickhouse
    healthcheck:
      test:
        - CMD
        - clickhouse-client
        - --user=ferristrace
        - --password=${CLICKHOUSE_PASSWORD:-ferristrace}
        - --query=SELECT 1
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${FERRISTRACE_IMAGE:-ferristrace:local}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      ferriskey-init:
        condition: service_completed_successfully
    # ferriskey answers as itself, not as localhost, in every url its discovery
    # document carries, so the browser that signs somebody in and this
    # container that verifies the result have to ask for the same name or the
    # issuer the server discovered will never match the issuer the token
    # carries. Inside this network the name is an alias of ferriskey-api,
    # below; on the operator's machine it is the one hosts line the README
    # asks for, pointing at the published port.
    # Anything else the server reads — the identity provider, the mail relay,
    # a project management token — is set in `.env` rather than named above,
    # so that adding a setting does not mean editing this file. A missing
    # .env is the ordinary case: the stack comes up on a clean machine
    # without one.
    env_file:
      - path: .env
        required: false
    # ferriskey-init writes the issuer and the public web client id it
    # provisioned into ferriskey/ferriskey.env, so that nobody has to copy
    # anything into .env. Compose reads env_file
    # entries before any container runs, so on a first `up` that file does
    # not exist yet; the server reads it itself when it starts instead,
    # after ferriskey-init has finished. A setting in .env still wins.
    volumes:
      - ./ferriskey:/run/ferriskey:ro
    # These win over the file, because they are how the server reaches the
    # three stores inside this network rather than something to choose.
    environment:
      FERRISTRACE_ENV_FILE: /run/ferriskey/ferriskey.env
      FERRISTRACE_DATABASE_URL: postgres://ferristrace:${POSTGRES_PASSWORD:-ferristrace}@postgres:5432/ferristrace
      FERRISTRACE_REDIS_URL: redis://redis:6379
      FERRISTRACE_SPANS__URL: http://clickhouse:8123
      FERRISTRACE_SPANS__DATABASE: ferristrace
      FERRISTRACE_SPANS__USER: ferristrace
      FERRISTRACE_SPANS__PASSWORD: ${CLICKHOUSE_PASSWORD:-ferristrace}
      FERRISTRACE_SPANS__RETENTION_DAYS: ${RETENTION_DAYS:-30}
      FERRISTRACE_AGENTS__AUDIENCE: ${FERRISTRACE_AGENTS__AUDIENCE:-ferristrace-agents}
      FERRISTRACE_MCP__GATEWAY_CLIENT_ID: ${FERRISKEY_MCP_GATEWAY_CLIENT_ID:-ferristrace-mcp-gateway}
      FERRISTRACE_MCP__PUBLIC_URL: ${FERRISTRACE_MCP_PUBLIC_URL:-http://localhost:8080}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    healthcheck:
      test: ["CMD", "ferristrace", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  mcp:
    build:
      context: ..
      dockerfile: Dockerfile.mcp
    image: ${FERRISTRACE_MCP_IMAGE:-ferristrace-mcp:local}
    environment:
      FERRISTRACE_MCP_API_URL: http://server:4318
      FERRISTRACE_MCP_LISTEN: 0.0.0.0:8081
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      server:
        condition: service_healthy

  mcp-gateway:
    build:
      context: ..
      dockerfile: Dockerfile.mcp-gateway
    image: ${FERRISTRACE_MCP_GATEWAY_IMAGE:-ferristrace-mcp-gateway:local}
    env_file:
      - path: .env
        required: false
    # Read at start for the same reason as the server's, above.
    volumes:
      - ./ferriskey:/run/ferriskey:ro
    environment:
      FERRISTRACE_ENV_FILE: /run/ferriskey/mcp-gateway.env
      FERRISTRACE_MCP_GATEWAY_LISTEN: 0.0.0.0:8080
      FERRISTRACE_MCP_GATEWAY_PUBLIC_URL: ${FERRISTRACE_MCP_PUBLIC_URL:-http://localhost:8080}
      FERRISTRACE_MCP_GATEWAY_UPSTREAM: http://mcp:8081
      FERRISTRACE_MCP_GATEWAY_ISSUER: http://ferriskey:3333/realms/ferristrace
      FERRISTRACE_MCP_GATEWAY_API_URL: http://server:4318
      FERRISTRACE_MCP_GATEWAY_AGENT_AUDIENCE: ${FERRISTRACE_AGENTS__AUDIENCE:-ferristrace-agents}
      FERRISTRACE_MCP_GATEWAY_SCOPES_SUPPORTED: '["telemetry:read","incidents:comment","incidents:resolve","oncall:acknowledge","groups"]'
      FERRISTRACE_MCP_GATEWAY_PDP__URL: http://ferriskey:3333
      FERRISTRACE_MCP_GATEWAY_PDP__REALM: ferristrace
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${MCP_GATEWAY_BIND:-127.0.0.1}:${MCP_GATEWAY_PORT:-8080}:8080"
    depends_on:
      mcp:
        condition: service_started
      server:
        condition: service_healthy
      ferriskey-init:
        condition: service_completed_successfully

  # FerrisKey is the only way in: it holds every account's identity and
  # issues the token the server trusts. Its own database, below, is
  # separate from ferristrace's so that FerrisKey can be pointed at a
  # different one, or left running, independently of this stack.
  ferriskey-db:
    image: postgres:18.2
    environment:
      POSTGRES_USER: ferriskey
      POSTGRES_PASSWORD: ${FERRISKEY_DB_PASSWORD:-ferriskey}
      POSTGRES_DB: ferriskey
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ferriskey-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ferriskey"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Runs FerrisKey's own migrations once and exits; `ferriskey-api` needs
  # them to already be applied, so it waits on this rather than racing it.
  # This is FerrisKey's own published compose file's way of doing it, not
  # ours: the api image doubles as the migration runner, entered through
  # `sqlx` instead of its own binary.
  ferriskey-migrations:
    image: ghcr.io/ferriskey/ferriskey-api:0.10.1
    entrypoint: ["sqlx"]
    command: ["migrate", "run", "--source", "/usr/local/src/ferriskey/migrations"]
    environment:
      DATABASE_URL: postgresql://ferriskey:${FERRISKEY_DB_PASSWORD:-ferriskey}@ferriskey-db/ferriskey
    restart: "no"
    depends_on:
      ferriskey-db:
        condition: service_healthy

  ferriskey-api:
    image: ghcr.io/ferriskey/ferriskey-api:0.10.1
    environment:
      DATABASE_HOST: ferriskey-db
      DATABASE_NAME: ferriskey
      DATABASE_USER: ferriskey
      DATABASE_PASSWORD: ${FERRISKEY_DB_PASSWORD:-ferriskey}
      # Read once, before FerrisKey's first start, to seed its first admin.
      # Changing them afterwards changes nothing until the database is
      # dropped: FerrisKey only ever creates that account, never updates it.
      ADMIN_USERNAME: ${FERRISKEY_ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${FERRISKEY_ADMIN_PASSWORD:-admin}
      ADMIN_EMAIL: ${FERRISKEY_ADMIN_EMAIL:-admin@ferristrace.local}
      ALLOWED_ORIGINS: ${FERRISKEY_ALLOWED_ORIGINS:-http://ferriskey:5555}
      WEBAPP_URL: ${FERRISKEY_WEBAPP_URL:-http://ferriskey:5555}
      AUTHZ_ENABLED: "true"
    # The shared name the server, the gateway and ferriskey-init reach it
    # under, on the port the browser reaches it on: see `server`. An alias
    # rather than the host's published port, which a container cannot
    # reach on Linux while it is bound to the host's loopback.
    networks:
      default:
        aliases: [ferriskey]
    # Published on the host under its own name, 3333, for the browser.
    # Bound to the loopback, like
    # `postgres` above, because FerrisKey's first admin defaults to
    # `admin`/`admin`: an administrator of this realm can mark any address
    # verified and sign into FerrisTrace as whoever holds it, so that
    # default must not face a network. Widening FERRISKEY_API_BIND puts it
    # on the network: set FERRISKEY_ADMIN_PASSWORD first.
    ports:
      - "${FERRISKEY_API_BIND:-127.0.0.1}:3333:3333"
    depends_on:
      ferriskey-migrations:
        condition: service_completed_successfully

  # The FerrisKey console. Signing in to FerrisTrace goes through its login
  # page, so it is served under the shared `ferriskey` name too: FerrisKey's
  # session cookie is set on that host when the browser is sent to
  # authorize, and a console on localhost would never get it back, then
  # start a sign in of its own that FerrisTrace refuses.
  ferriskey-webapp:
    image: ghcr.io/ferriskey/ferriskey-webapp:0.10.1
    environment:
      API_URL: ${FERRISKEY_WEBAPP_API_URL:-http://ferriskey:3333}
    # Bound to the loopback for the same reason as ferriskey-api, above:
    # this is where that admin password is typed in.
    ports:
      - "${FERRISKEY_WEBAPP_BIND:-127.0.0.1}:5555:80"
    depends_on:
      - ferriskey-api

  # Creates the realm, the public web client, its redirect uri and its web
  # origin through FerrisKey's admin api, and writes the two
  # FERRISTRACE_OIDC__* settings `server` reads into
  # ferriskey/ferriskey.env — the second env_file entry on `server`, above.
  # Runs once per `up` and exits; see ferriskey-init.sh for what makes a
  # second run safe.
  ferriskey-init:
    image: curlimages/curl:8.11.1
    entrypoint: ["sh", "/ferriskey-init.sh"]
    # Root only to hand the files it writes to the distroless nonroot user
    # (65532) the server and the gateway run as, and who read them.
    user: "0:0"
    volumes:
      - ./ferriskey-init.sh:/ferriskey-init.sh:ro
      - ./ferriskey:/out
      - ../docs/mcp:/mcp:ro
    environment:
      FERRISKEY_API_URL: http://ferriskey-api:3333
      ADMIN_USERNAME: ${FERRISKEY_ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${FERRISKEY_ADMIN_PASSWORD:-admin}
      FERRISKEY_REALM: ferristrace
      FERRISKEY_CLIENT_ID: ${FERRISKEY_CLIENT_ID:-ferristrace}
      FERRISKEY_APP_ORIGIN: http://localhost:${OTLP_HTTP_PORT:-4318}
      FERRISKEY_EXTRA_APP_ORIGINS: ${FERRISKEY_EXTRA_APP_ORIGINS:-}
      # The name the server and the browser both resolve to FerrisKey;
      # see the comment on `server`.
      FERRISKEY_ISSUER_BASE_URL: http://ferriskey:3333
      OUT_FILE: /out/ferriskey.env
      MCP_OUT_FILE: /out/mcp-gateway.env
      FERRISKEY_MCP_GATEWAY_CLIENT_ID: ${FERRISKEY_MCP_GATEWAY_CLIENT_ID:-ferristrace-mcp-gateway}
      FERRISKEY_AGENT_AUDIENCE: ${FERRISTRACE_AGENTS__AUDIENCE:-ferristrace-agents}
      FERRISKEY_MCP_PUBLIC_URL: ${FERRISTRACE_MCP_PUBLIC_URL:-http://localhost:8080}
      FERRISKEY_MCP_ORGS: ${FERRISTRACE_MCP_ORGS:-}
    depends_on:
      ferriskey-api:
        condition: service_started

volumes:
  postgres:
  clickhouse:
  redis:
  ferriskey-db:
